services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      LOCAL_STORAGE_ROOT: /data/attachments
      ANALYTICAL_NOTE_ROOT: /data/analytical-notes
      BACKUP_ROOT: /data/backups
    volumes: ['./data:/data']
    depends_on:
      postgres: {condition: service_healthy}
    ports: ['127.0.0.1:${API_PORT:-8100}:8000']
  web:
    build: {context: ., dockerfile: docker/web.Dockerfile}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on: [api]
    ports: ['127.0.0.1:${WEB_PORT:-3100}:3000']
  worker:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    command: [python, -m, app.worker]
    restart: unless-stopped
    env_file: .env
    environment:
      LOCAL_STORAGE_ROOT: /data/attachments
      ANALYTICAL_NOTE_ROOT: /data/analytical-notes
    volumes: ['./data:/data']
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
