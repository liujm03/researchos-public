[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-api"
version = "0.1.0"
description = "ResearchOS REST API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "argon2-cffi>=23,<26",
  "email-validator>=2,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.32,<1",
  "pdfplumber>=0.11,<1",
  "pypdf==6.19.0",
  "pypdfium2>=4.30,<6",
  "PyYAML>=6,<7",
  "pybtex>=0.26,<0.27",
  "rispy>=0.10,<0.11",
]

[project.optional-dependencies]
codex = ["openai-codex>=0.158,<0.159"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
